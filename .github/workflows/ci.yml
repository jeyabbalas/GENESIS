name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Keep the thread pool of the tests within the two cores of a hosted runner.
  GENESIS_NUM_THREADS: "2"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }}${{ matrix.torch && ', with PyTorch' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        torch: [false]
        include:
          # One job with (CPU-only) PyTorch so that the torch backend tests run ...
          - os: ubuntu-latest
            python-version: "3.12"
            torch: true
          # ... every other job runs without it, which proves that it is optional.
          - os: macos-latest
            python-version: "3.12"
            torch: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install CPU-only PyTorch
        if: matrix.torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Environment
        run: genesis doctor
      - name: Tests
        run: python -m pytest -q -m "not slow"
